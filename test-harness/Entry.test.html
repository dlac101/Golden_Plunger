<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cleanest Cabin: Scoring</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg-page:        #0b0f17;
    --bg-card:        #121820;
    --bg-code:        #0d1219;
    --border:         #1e2d42;
    --border-subtle:  #182030;
    --cyan:           #00c8e6;
    --cyan-dim:       #2596b3;
    --cyan-glow:      rgba(0, 200, 230, 0.12);
    --text-primary:   #dde4ef;
    --text-secondary: #7a90aa;
    --text-muted:     #7488a1;
    --accent-green:   #22c997;
    --accent-yellow:  #f5a623;
    --accent-red:     #f05a5a;

    --alpha:#f26a6a; --alpha-tint:rgba(242,106,106,.13); --alpha-soft:rgba(242,106,106,.55);
    --beta:#5aa2ff;  --beta-tint:rgba(90,162,255,.13);   --beta-soft:rgba(90,162,255,.55);
    --gamma:#34d17f; --gamma-tint:rgba(52,209,127,.13);  --gamma-soft:rgba(52,209,127,.55);

    --score-gray:#7a90aa;
    --score-ink:#0b0f17;
    --accent-ink:#0b0f17;
    --sb-border:#3e5474;
    --spotless-ink:#22c997;
    --spotless-bg:rgba(34,201,151,.08);
    --danger-ink:#f58a8a;
    --danger-tint:rgba(240,90,90,.08);
    --danger-soft:rgba(240,90,90,.45);
    --warn-tint:rgba(245,166,35,.10);
    --warn-soft:rgba(245,166,35,.5);
    --veil:rgba(11,15,23,.95);
    --radius:14px;
  }
  html.light {
    --bg-page:        #eef2f6;
    --bg-card:        #ffffff;
    --bg-code:        #f1f5f9;
    --border:         #e2e8f0;
    --border-subtle:  #eaeef3;
    --cyan:           #006e8c;
    --cyan-dim:       #0c6a80;
    --cyan-glow:      rgba(0,110,140,0.10);
    --text-primary:   #0f172a;
    --text-secondary: #475569;
    --text-muted:     #54637a;
    --accent-green:   #10b981;
    --accent-yellow:  #d97706;
    --accent-red:     #dc2626;

    --alpha:#dc2626; --alpha-tint:rgba(220,38,38,.08); --alpha-soft:rgba(220,38,38,.45);
    --beta:#2563eb;  --beta-tint:rgba(37,99,235,.08);  --beta-soft:rgba(37,99,235,.45);
    --gamma:#15a34a; --gamma-tint:rgba(21,163,74,.08); --gamma-soft:rgba(21,163,74,.45);

    --score-gray:#94a3b8;
    --score-ink:#0f172a;
    --accent-ink:#ffffff;
    --sb-border:#cbd5e1;
    --spotless-ink:#047857;
    --spotless-bg:rgba(16,185,129,.08);
    --danger-ink:#b91c1c;
    --danger-tint:rgba(220,38,38,.07);
    --danger-soft:rgba(220,38,38,.45);
    --warn-tint:rgba(217,119,6,.08);
    --warn-soft:rgba(217,119,6,.5);
    --veil:rgba(238,242,246,.95);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%;background:var(--bg-page);color-scheme:dark}
  html.light{color-scheme:light}
  body{
    font-family:'Poppins',system-ui,sans-serif;
    background:var(--bg-page);
    color:var(--text-primary);
    font-size:16px;
    line-height:1.4;
    min-height:100vh;
  }
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
  button:disabled{cursor:default}
  :focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:6px}
  input,textarea{font-family:inherit;font-size:16px;color:var(--text-primary)}

  .wrap{max-width:520px;margin:0 auto;padding:0 14px}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--veil);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    border-bottom:1.5px solid var(--border);
    padding-top:env(safe-area-inset-top);
  }
  .topbar-inner{max-width:520px;margin:0 auto;padding:10px 14px 10px}
  .brand-row{display:flex;align-items:center;gap:8px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
  .brand svg{flex:none;color:var(--cyan)}
  .brand h1{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
  .brand .sub{
    display:block;font-family:'IBM Plex Mono',Consolas,monospace;
    font-size:9.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
    color:var(--cyan);margin-top:2px;white-space:nowrap;
  }
  .dash-link{
    flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    min-height:44px;min-width:44px;padding:0 12px;border-radius:999px;
    border:1.5px solid var(--border);background:var(--bg-card);
    font-size:13.5px;font-weight:600;color:var(--cyan);text-decoration:none;
  }
  .dash-link:active{transform:scale(.97)}

  .theme-toggle{
    flex:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;
    min-height:44px;min-width:44px;padding:0 12px;border-radius:999px;
    border:1.5px solid var(--border);background:var(--bg-card);color:var(--text-secondary);
    font-family:'Poppins',system-ui,sans-serif;font-size:13px;font-weight:500;
    transition:color .15s,border-color .15s;
  }
  .theme-toggle:hover{border-color:var(--cyan);color:var(--cyan)}
  .theme-toggle:active{transform:scale(.97)}
  .theme-toggle svg{width:16px;height:16px;display:block}
  .theme-toggle .icon-moon,.theme-toggle .tt-dark{display:none}
  .theme-toggle .icon-sun,.theme-toggle .tt-light{display:inline-flex}
  html.light .theme-toggle .icon-moon,html.light .theme-toggle .tt-dark{display:inline-flex}
  html.light .theme-toggle .icon-sun,html.light .theme-toggle .tt-light{display:none}
  @media (max-width:430px){
    .theme-toggle span{display:none!important}
    .theme-toggle{padding:0}
    .dash-link .dl-text{display:none}
    .dash-link{padding:0}
  }

  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--bg-code);border:1px solid var(--border-subtle);border-radius:999px;padding:4px;margin-top:10px}
  .seg-btn{
    min-height:44px;border-radius:999px;border:1px solid transparent;font-size:15px;font-weight:600;color:var(--text-secondary);
    transition:background .12s,color .12s,border-color .12s;
  }
  .seg-btn.on{background:var(--cyan-glow);color:var(--cyan);border-color:var(--cyan-dim);font-weight:700}
  .seg-btn.armed{background:var(--accent-yellow);color:var(--score-ink);border-color:var(--accent-yellow);font-weight:700}
  .seg-btn:active{transform:scale(.97)}

  .prog{display:flex;align-items:center;gap:10px;margin-top:10px;min-height:20px}
  .prog-text{font-family:'IBM Plex Mono',Consolas,monospace;font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--text-primary)}
  .prog-bar{flex:1;height:8px;border-radius:99px;background:var(--bg-code);border:1px solid var(--border-subtle);overflow:hidden}
  .prog-fill{height:100%;width:100%;border-radius:99px;background:var(--cyan);transform-origin:left center;transform:scaleX(0);transition:transform .35s ease}
  .prog.complete .prog-fill{background:var(--accent-green)}
  .prog.complete .prog-text{color:var(--accent-green)}

  body.mode-form .seg,body.mode-form .prog{display:none}

  /* ---------- spinner ---------- */
  .spin{
    width:18px;height:18px;flex:none;border-radius:50%;
    border:3px solid var(--border);border-top-color:var(--cyan);
    animation:whirl .7s linear infinite;
  }
  .spin.big{width:30px;height:30px}
  @keyframes whirl{to{transform:rotate(360deg)}}

  /* ---------- loading / fatal ---------- */
  .centered{display:flex;flex-direction:column;align-items:center;gap:14px;padding:64px 20px;text-align:center}
  .centered p{font-size:15px;font-weight:500;color:var(--text-secondary)}
  .retry-card{
    background:var(--bg-card);border:1.5px solid var(--cyan);
    border-radius:var(--radius);padding:22px 18px;margin:40px 0;text-align:center;
  }
  .retry-card h2{font-size:17px;font-weight:700;margin-bottom:6px}
  .retry-card p{font-size:14px;color:var(--text-secondary);margin-bottom:14px}
  .retry-btn{
    min-height:48px;padding:0 22px;border-radius:12px;background:var(--cyan);color:var(--accent-ink);
    font-size:15px;font-weight:700;
  }

  /* ---------- banners ---------- */
  .banner{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--danger-tint);border:1.5px solid var(--danger-soft);color:var(--danger-ink);
    border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500;margin:10px 0;
  }
  .banner .retry{
    margin-left:auto;min-height:38px;padding:0 14px;border-radius:999px;
    background:var(--danger-ink);color:var(--accent-ink);font-size:13px;font-weight:700;
  }

  .hint{font-size:13.5px;font-weight:500;color:var(--text-secondary);margin:10px 2px 0;text-align:center}

  /* ---------- tie banner ---------- */
  .tie-banner{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--warn-tint);border:1.5px solid var(--warn-soft);
    border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500;margin:12px 0 0;
  }
  .tie-banner svg{color:var(--accent-yellow);flex:none}
  .tie-banner b{font-weight:700}
  .tie-open{
    margin-left:auto;min-height:40px;padding:0 16px;border-radius:999px;flex:none;
    background:var(--accent-yellow);color:var(--score-ink);font-size:13.5px;font-weight:700;
  }
  .tie-open:active{transform:scale(.97)}

  /* ---------- picker ---------- */
  .group{margin-top:18px}
  .group-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:0 2px}
  .gdot{width:11px;height:11px;border-radius:50%;flex:none;background:var(--cyan)}
  .gdot[data-g=alpha]{background:var(--alpha)}
  .gdot[data-g=beta]{background:var(--beta)}
  .gdot[data-g=gamma]{background:var(--gamma)}
  .group-head h2{
    font-family:'IBM Plex Mono',Consolas,monospace;
    font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text-primary);
  }
  .gcount{margin-left:auto;font-family:'IBM Plex Mono',Consolas,monospace;font-size:12px;color:var(--text-secondary)}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tile{
    position:relative;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:4px;
    min-height:68px;padding:10px;border-radius:var(--radius);
    background:var(--bg-card);border:1.5px solid var(--border);
    border-left:5px solid var(--cyan);
    transition:transform .06s ease;
  }
  .tile[data-g=alpha]{border-left-color:var(--alpha)}
  .tile[data-g=beta]{border-left-color:var(--beta)}
  .tile[data-g=gamma]{border-left-color:var(--gamma)}
  .tile.scored{background:var(--cyan-glow);border-color:var(--cyan-dim);border-left-color:var(--cyan)}
  .tile.scored[data-g=alpha]{background:var(--alpha-tint);border-color:var(--alpha-soft);border-left-color:var(--alpha)}
  .tile.scored[data-g=beta]{background:var(--beta-tint);border-color:var(--beta-soft);border-left-color:var(--beta)}
  .tile.scored[data-g=gamma]{background:var(--gamma-tint);border-color:var(--gamma-soft);border-left-color:var(--gamma)}
  .tile:active{transform:scale(.96)}
  .tcode{font-family:'IBM Plex Mono',Consolas,monospace;font-size:17px;font-weight:500;letter-spacing:-.01em}
  .tmeta{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary)}
  .tbadge{
    position:absolute;top:7px;right:7px;
    background:var(--text-primary);color:var(--bg-page);border-radius:999px;
    font-family:'IBM Plex Mono',Consolas,monospace;
    font-size:11.5px;font-weight:500;padding:3px 8px;line-height:1.2;
  }
  #groups.busy{opacity:.5;pointer-events:none}
  #pickerView{padding-bottom:36px}

  /* ---------- scoring form ---------- */
  #formView{padding-bottom:8px}
  .form-top{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}
  .back{
    display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 14px 0 8px;
    border-radius:999px;border:1.5px solid var(--border);background:var(--bg-card);
    font-size:15px;font-weight:600;color:var(--text-primary);flex:none;
  }
  .back:active{transform:scale(.97)}
  .form-cabin{display:flex;align-items:center;gap:8px;min-width:0}
  .cabin-code{font-family:'IBM Plex Mono',Consolas,monospace;font-size:24px;font-weight:500;letter-spacing:-.02em}
  .pill{
    display:inline-flex;align-items:center;gap:6px;background:var(--cyan-glow);
    border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;white-space:nowrap;
  }
  .pill[data-g=alpha]{background:var(--alpha-tint)}
  .pill[data-g=beta]{background:var(--beta-tint)}
  .pill[data-g=gamma]{background:var(--gamma-tint)}
  .pill .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--cyan)}
  .pill[data-g=alpha] .dot{background:var(--alpha)}
  .pill[data-g=beta] .dot{background:var(--beta)}
  .pill[data-g=gamma] .dot{background:var(--gamma)}

  .spotless{
    width:100%;min-height:48px;border-radius:12px;margin-bottom:12px;
    border:2px dashed var(--accent-green);background:var(--spotless-bg);color:var(--spotless-ink);
    font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .spotless:active{transform:scale(.98)}
  .spotless.done{background:var(--accent-green);color:var(--score-ink);border-style:solid}

  .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .card.polish{margin-top:10px;border-style:dashed}
  .cat{display:flex;align-items:center;gap:10px;padding:11px 12px}
  .cat + .cat{border-top:1px solid var(--border)}
  .cat-info{flex:1;min-width:0}
  .cat-label{font-size:16px;font-weight:600}
  .cat-hint{font-size:12.5px;font-weight:400;color:var(--text-secondary);margin-top:1px}
  .cat.missing{background:var(--danger-tint);box-shadow:inset 0 0 0 2px var(--danger-soft)}
  .sbs{display:flex;gap:8px;flex:none}
  .sb{
    width:52px;height:52px;border-radius:12px;
    border:2px solid var(--sb-border);background:var(--bg-code);
    font-family:'IBM Plex Mono',Consolas,monospace;
    font-size:21px;font-weight:500;color:var(--text-secondary);
    transition:background .1s,border-color .1s,color .1s;
  }
  .sb:active{transform:scale(.93)}
  .sb.on0{background:var(--score-gray);border-color:var(--score-gray);color:var(--score-ink)}
  .sb.on1{background:var(--accent-yellow);border-color:var(--accent-yellow);color:var(--score-ink)}
  .sb.on2{background:var(--accent-green);border-color:var(--accent-green);color:var(--score-ink)}
  @media (max-width:360px){.sb{width:46px;height:46px;font-size:19px}.sbs{gap:6px}}

  .stepper{display:flex;align-items:center;gap:6px;flex:none}
  .step-btn{
    width:52px;height:52px;border-radius:12px;
    border:2px solid var(--sb-border);background:var(--bg-code);
    font-family:'IBM Plex Mono',Consolas,monospace;
    font-size:24px;font-weight:500;color:var(--text-primary);
  }
  .step-btn:disabled{opacity:.35}
  .step-btn:active{transform:scale(.93)}
  .pol-val{
    min-width:44px;text-align:center;
    font-family:'IBM Plex Mono',Consolas,monospace;
    font-size:22px;font-weight:500;color:var(--text-primary);
  }
  .pol-val.pop{animation:pop .25s ease}
  @media (max-width:360px){.step-btn{width:46px;height:46px;font-size:21px}.pol-val{min-width:38px}}

  #notes{
    width:100%;margin-top:12px;padding:11px 12px;min-height:56px;resize:vertical;
    border:1.5px solid var(--border);border-radius:12px;background:var(--bg-card);
  }
  #notes::placeholder{color:var(--text-muted)}
  .insp{display:flex;align-items:center;gap:10px;margin-top:10px}
  .insp span{
    font-family:'IBM Plex Mono',Consolas,monospace;
    font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text-secondary);flex:none;
  }
  .insp input{
    flex:1;min-height:44px;padding:0 12px;border:1.5px solid var(--border);border-radius:12px;background:var(--bg-card);
  }
  .insp input::placeholder{color:var(--text-muted)}
  .insp input.missing{border-color:var(--danger-soft);background:var(--danger-tint)}

  .form-footer{
    position:sticky;bottom:0;z-index:15;
    display:flex;align-items:center;gap:14px;
    margin:14px -14px 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:var(--veil);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    border-top:1.5px solid var(--border);
  }
  .totals{flex:none;display:flex;flex-direction:column;gap:1px}
  .tot-line{display:flex;align-items:baseline;gap:6px}
  .tot-label{
    font-family:'IBM Plex Mono',Consolas,monospace;
    font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);
    min-width:78px;
  }
  .tot-num{font-family:'IBM Plex Mono',Consolas,monospace;font-size:17px;color:var(--text-primary)}
  .tot-max{font-family:'IBM Plex Mono',Consolas,monospace;font-size:11px;color:var(--text-secondary)}
  .tot-num.pop{animation:pop .25s ease}
  @keyframes pop{40%{transform:scale(1.25)}}
  .submit{
    flex:1;min-height:56px;border-radius:14px;background:var(--cyan);color:var(--accent-ink);
    font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .submit:active{transform:scale(.98)}
  .submit:disabled{opacity:.65}
  .btnspin{
    width:16px;height:16px;border-radius:50%;flex:none;
    border:3px solid rgba(0,0,0,.3);border-top-color:currentColor;
    animation:whirl .7s linear infinite;
  }

  /* ---------- resolve ties view ---------- */
  #tiesView{padding-bottom:36px}
  .ties-title{font-size:19px;font-weight:700}
  .ties-title .mono-day{font-family:'IBM Plex Mono',Consolas,monospace;font-weight:500;color:var(--cyan)}
  .tie-cluster{margin-top:14px;padding:14px}
  .tie-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tie-vals{margin-left:auto;font-family:'IBM Plex Mono',Consolas,monospace;font-size:11.5px;color:var(--text-secondary)}
  .tie-hint{font-size:12.5px;color:var(--text-secondary);margin:8px 0 10px}
  .tie-row{
    width:100%;display:flex;align-items:center;gap:12px;min-height:56px;
    padding:8px 10px;border:1.5px solid var(--sb-border);border-radius:12px;
    background:var(--bg-code);margin-bottom:8px;text-align:left;
    transition:border-color .1s,background .1s;
  }
  .tie-row:active{transform:scale(.98)}
  .tie-row.picked{border-color:var(--cyan);background:var(--cyan-glow)}
  .tie-rank{
    width:34px;height:34px;flex:none;border-radius:50%;
    border:2px dashed var(--sb-border);
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',Consolas,monospace;font-size:16px;font-weight:500;
  }
  .tie-row.picked .tie-rank{background:var(--cyan);border:2px solid var(--cyan);color:var(--accent-ink)}
  .tie-body{display:flex;flex-direction:column;gap:2px;min-width:0}
  .tie-code{font-family:'IBM Plex Mono',Consolas,monospace;font-size:17px}
  .tie-break{font-family:'IBM Plex Mono',Consolas,monospace;font-size:10.5px;color:var(--text-secondary);line-height:1.5}
  .tie-notes{font-size:12.5px;font-style:italic;color:var(--text-secondary);line-height:1.35;white-space:normal}
  .tie-actions{display:flex;gap:10px;margin-top:4px}
  .tie-reset{
    min-height:44px;padding:0 16px;border-radius:12px;flex:none;
    border:1.5px solid var(--border);background:var(--bg-card);color:var(--text-secondary);
    font-weight:600;font-size:14px;
  }
  .tie-reset:disabled{opacity:.45}
  .tie-confirm{
    flex:1;min-height:44px;border-radius:12px;background:var(--cyan);color:var(--accent-ink);
    font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .tie-confirm:disabled{opacity:.55}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));z-index:50;
    width:min(520px,calc(100% - 24px));
    transform:translate(-50%,140%);opacity:0;
    transition:transform .25s ease,opacity .25s ease;
    background:var(--bg-card);color:var(--text-primary);

<script>
(function(){
'use strict';

var LS_NAME='cleanestCabin.inspector';
var LS_DAY='cleanestCabin.day';
var LS_DRAFTS='cleanestCabin.drafts';

var GROUP_SLUGS=['alpha','beta','gamma'];

var state={
  config:null,
  day:null,
  armedDay:null,
  armedTimer:null,
  scores:{},
  scoresLoading:false,
  reqId:0,
  rankReqId:0,
  unresolvedTies:[],
  rankErr:false,
  tieTaps:{},
  tieSubmitting:null,
  cabin:null,
  sel:{},
  editing:false,
  submitting:false,
  pickerScroll:0,
  toastTimer:null
};

function $(id){return document.getElementById(id);}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function groupSlug(name){
  var k=String(name||'').toLowerCase();
  return GROUP_SLUGS.indexOf(k)>=0?k:'other';
}
function genderLabel(g){
  if(!g)return '';
  var s=String(g);
  if(s.length>1)return s;
  return {G:'Girls',B:'Boys',F:'Girls',M:'Boys'}[s.toUpperCase()]||s;
}
function catLabel(cat){
  if(cat.label)return cat.label;
  if(cat.key==='bath'&&state.config.bathLabel)return state.config.bathLabel;
  return cat.key;
}
function cleanMax(){return state.config.categories.length*2;}
function polCfg(){return state.config.polish||{};}
function polMin(){var v=polCfg().min;return typeof v==='number'?v:0;}
function polMax(){var v=polCfg().max;return typeof v==='number'?v:10;}
function polDefault(){var v=polCfg()['default'];return typeof v==='number'?v:5;}
function polLabel(){return (state.config&&state.config.polish&&state.config.polish.label)||'Polish';}

/* ---------- localStorage ---------- */
function getName(){try{return localStorage.getItem(LS_NAME)||'';}catch(e){return '';}}
function saveName(n){try{localStorage.setItem(LS_NAME,n);}catch(e){}}
function todayStr(){
  var d=new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}
function todayDefaultDay(){
  var wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date().getDay()];
  return state.config.days.indexOf(wd)>=0?wd:state.config.days[0];
}
function loadDay(){
  // Last-used day is only trusted same-calendar-day, so a reload mid-round
  // keeps the day but tomorrow's first open defaults to the real weekday.
  try{
    var s=JSON.parse(localStorage.getItem(LS_DAY)||'null');
    if(s&&s.date===todayStr()&&state.config.days.indexOf(s.day)>=0)return s.day;
  }catch(e){}
  return todayDefaultDay();
}
function saveDay(day){
  try{localStorage.setItem(LS_DAY,JSON.stringify({day:day,date:todayStr()}));}catch(e){}
}

/* ---------- in-progress scoring drafts (survive reload/lost signal until Save succeeds) ---------- */
function draftKey(day,code){return day+'|'+code;}
function loadDrafts(){
  try{return JSON.parse(localStorage.getItem(LS_DRAFTS)||'{}')||{};}catch(e){return {};}
}
function saveDraft(day,code,sel,notes){
  try{
    var d=loadDrafts();
    d[draftKey(day,code)]={sel:sel,notes:notes};
    localStorage.setItem(LS_DRAFTS,JSON.stringify(d));
  }catch(e){}
}
function getDraft(day,code){
  return loadDrafts()[draftKey(day,code)]||null;
}
function clearDraft(day,code){
  try{
    var d=loadDrafts();
    delete d[draftKey(day,code)];
    localStorage.setItem(LS_DRAFTS,JSON.stringify(d));
  }catch(e){}
}
function persistDraft(){
  if(!state.cabin)return;
  saveDraft(state.day,state.cabin.code,state.sel,$('notes').value);
}

/* ---------- views ---------- */
function show(id){
  ['loadingView','fatalView','pickerView','formView','tiesView'].forEach(function(v){
    $(v).hidden=(v!==id);
  });
  document.body.classList.toggle('mode-form',id==='formView'||id==='tiesView');
}

/* ---------- boot / config ---------- */
function serverReady(){
  return typeof google!=='undefined'&&google.script&&google.script.run;
}
function boot(){
  show('loadingView');
  if(!serverReady()){
    fatal('This page must be opened from its Google Apps Script web app link.');
    return;
  }
  google.script.run
    .withSuccessHandler(onConfig)
    .withFailureHandler(function(err){fatal(err&&err.message?err.message:'');})
    .getConfig();
}
function fatal(msg){
  if(msg)$('fatalMsg').textContent=msg;
  show('fatalView');
}
function onConfig(cfg){
  state.config=cfg;
  state.day=loadDay();
  $('cleanMaxEl').textContent='/'+cleanMax();
  var pc=polCfg();
  if(pc.label)$('polishLabel').textContent=pc.label;
  $('polishStepper').setAttribute('aria-label',polLabel()+' score');
  $('polMinus').setAttribute('aria-label','Decrease '+polLabel().toLowerCase());
  $('polPlus').setAttribute('aria-label','Increase '+polLabel().toLowerCase());
  $('polishTotLabel').textContent=polLabel();
  $('polishHint').textContent=polDefault()+' = met expectations · breaks ties';
  renderDayRow();
  show('pickerView');
  loadScores();
}

/* ---------- scores + rankings ---------- */
function loadScores(){
  state.scoresLoading=true;
  $('scoresErr').innerHTML='';
  renderProgress();
  renderGroups();
  var rid=++state.reqId;
  google.script.run
    .withSuccessHandler(function(rows){if(rid===state.reqId)onScores(rows);})
    .withFailureHandler(function(err){if(rid===state.reqId)onScoresErr(err);})
    .getScores(state.day);
  refreshRankings(false);
}
function onScores(rows){
  state.scoresLoading=false;
  state.scores={};
  (rows||[]).forEach(function(r){if(r&&r.cabin)state.scores[r.cabin]=r;});
  renderProgress();
  renderGroups();
}
function onScoresErr(err){
  state.scoresLoading=false;
  renderProgress();
  renderGroups();
  $('scoresErr').innerHTML=
    '<div class="banner">Couldn&rsquo;t load scores for '+esc(state.day)+'.'+
    (err&&err.message?' ('+esc(err.message)+')':'')+
    '<button type="button" class="retry" id="retryScores">Retry</button></div>';
  $('retryScores').onclick=loadScores;
}
function refreshRankings(fromConfirm){
  if(!serverReady())return;
  var rid=++state.rankReqId;
  google.script.run
    .withSuccessHandler(function(r){
      if(rid!==state.rankReqId)return;
      state.rankErr=false;
      state.unresolvedTies=(r&&r.unresolvedTies)||[];
      onRankingsUpdated(fromConfirm);
    })
    .withFailureHandler(function(){
      if(rid!==state.rankReqId)return;
      state.rankErr=true;
      onRankingsUpdated(false);
    })
    .getRankings(state.day);
}
function onRankingsUpdated(fromConfirm){
  renderTieBanner();
  if($('tiesView').hidden)return;
  if(state.rankErr){renderTies();return;}
  if(!state.unresolvedTies.length){
    backToPicker();
    if(fromConfirm)simpleToast('All ties resolved for '+state.day+'.');
    return;
  }
  renderTies();
  if(fromConfirm)simpleToast('Order saved. '+state.unresolvedTies.length+' more to break.');
}

/* ---------- picker rendering ---------- */
function renderDayRow(){
  $('dayRow').innerHTML=state.config.days.map(function(d){
    var armed=(state.armedDay===d);
    var cls='seg-btn'+(d===state.day?' on':'')+(armed?' armed':'');
    var label=armed?'Tap again':esc(d);
    var ariaLabel=armed?' aria-label="'+esc(d)+', tap again to confirm switching day"':'';
    return '<button type="button" class="'+cls+
      '" data-day="'+esc(d)+'" aria-pressed="'+(d===state.day)+'"'+ariaLabel+'>'+label+'</button>';
  }).join('');
}
function doneCount(){
  return state.config.cabins.filter(function(c){return state.scores[c.code];}).length;
}
function renderProgress(){
  var total=state.config.cabins.length;
  var done=doneCount();
  var row=$('progressRow');
  row.classList.toggle('complete',total>0&&done===total);
  $('progText').textContent=(total>0&&done===total)
    ?'All '+total+' scored!'
    :done+' / '+total+' scored';
  $('progFill').style.transform='scaleX('+(total?(done/total):0)+')';
  $('progSpin').hidden=!state.scoresLoading;
  var hint=$('emptyHint');
  hint.hidden=state.scoresLoading||done>0;
  hint.textContent='Nothing scored yet for '+state.day+'. Tap a cabin to start your rounds.';
}
function renderTieBanner(){
  var el=$('tieBanner');
  if(state.rankErr){
    el.innerHTML='<div class="tie-banner">Couldn&rsquo;t check ties for '+esc(state.day)+'.'+
      '<button type="button" class="tie-open" id="tieRetry">Retry</button></div>';
    $('tieRetry').onclick=function(){refreshRankings(false);};
    return;
  }
  var n=state.unresolvedTies.length;
  if(!n){el.innerHTML='';return;}
  el.innerHTML='<div class="tie-banner">'+
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'+
    '<span><b>'+n+' tie'+(n===1?'':'s')+'</b> to break for '+esc(state.day)+'</span>'+
    '<button type="button" class="tie-open" id="tieOpenBtn">Resolve</button></div>';
  $('tieOpenBtn').onclick=openTies;
}
function renderGroups(){
  var cfg=state.config;
  var html='';
  cfg.ageGroups.forEach(function(g){
    var cabs=cfg.cabins.filter(function(c){return c.ageGroup===g;});
    if(!cabs.length)return;
    var slug=groupSlug(g);
    var done=cabs.filter(function(c){return state.scores[c.code];}).length;
    html+='<section class="group">'+
      '<div class="group-head"><span class="gdot" data-g="'+slug+'"></span>'+
      '<h2>'+esc(g)+'</h2><span class="gcount">'+done+'/'+cabs.length+'</span></div>'+
      '<div class="tiles">';
    cabs.forEach(function(c){
      var rec=state.scores[c.code];
      html+='<button type="button" class="tile'+(rec?' scored':'')+'" data-code="'+esc(c.code)+
        '" data-g="'+slug+'" aria-label="'+esc(c.code)+', '+esc(g)+' '+esc(genderLabel(c.gender))+
        (rec?', scored '+esc(rec.cleanliness)+' of '+cleanMax():', not scored yet')+'">'+
        '<span class="tcode">'+esc(c.code)+'</span>'+
        '<span class="tmeta">'+esc(genderLabel(c.gender))+'</span>'+
        (rec?'<span class="tbadge">✓ '+esc(rec.cleanliness)+'</span>':'')+
        '</button>';
    });
    html+='</div></section>';
  });
  var wrap=$('groups');
  wrap.innerHTML=html;
  wrap.classList.toggle('busy',state.scoresLoading);
}

/* ---------- scoring form ---------- */
function openCabin(code){
  var cabin=null;
  state.config.cabins.forEach(function(c){if(c.code===code)cabin=c;});
  if(!cabin)return;
  if(!$('pickerView').hidden)state.pickerScroll=window.pageYOffset||0;
  state.cabin=cabin;
  var rec=state.scores[code];
  state.editing=!!rec;
  state.sel={};
  state.config.categories.forEach(function(cat){
    var v=rec?rec[cat.key]:null;
    state.sel[cat.key]=(v==null||v==='')?null:Number(v);
  });
  var p=rec?rec.polish:null;
  state.sel.polish=(p==null||p==='')?polDefault():Number(p);
  var savedNotes=(rec&&rec.notes)?String(rec.notes):'';
  var draft=getDraft(state.day,code);
  if(draft){
    if(draft.sel){
      state.config.categories.forEach(function(cat){
        if(draft.sel[cat.key]!=null)state.sel[cat.key]=draft.sel[cat.key];
      });
      if(draft.sel.polish!=null)state.sel.polish=draft.sel.polish;
    }
    if(draft.notes!=null)savedNotes=draft.notes;
  }
  $('notes').value=savedNotes;
  $('inspName').value=getName();
  $('inspName').classList.remove('missing');
  $('formErr').innerHTML='';
  renderForm();
  show('formView');
  window.scrollTo(0,0);
}
function catRowHtml(key,label,hint){
  var btns='';
  [0,1,2].forEach(function(v){
    btns+='<button type="button" class="sb" data-val="'+v+'" aria-pressed="false" aria-label="'+
      esc(label)+' score '+v+'">'+v+'</button>';
  });
  return '<div class="cat" data-key="'+esc(key)+'">'+
    '<div class="cat-info"><div class="cat-label">'+esc(label)+'</div>'+
    (hint?'<div class="cat-hint">'+esc(hint)+'</div>':'')+'</div>'+
    '<div class="sbs" role="group" aria-label="'+esc(label)+'">'+btns+'</div></div>';
}
function renderForm(){
  var c=state.cabin;
  $('formCabinCode').textContent=c.code;
  var pill=$('formPill');
  pill.setAttribute('data-g',groupSlug(c.ageGroup));
  pill.innerHTML='<span class="dot"></span>'+esc(c.ageGroup)+' · '+esc(genderLabel(c.gender));
  var html='';
  state.config.categories.forEach(function(cat){
    html+=catRowHtml(cat.key,catLabel(cat),cat.hint||'');
  });
  $('catRows').innerHTML=html;
  paintAllRows();
  setPolish(state.sel.polish,true);
  $('allTwosBtn').classList.remove('done');
  updateSubmitBtn();
  updateReadout();
}
function paintRow(row){
  var val=state.sel[row.getAttribute('data-key')];
  var btns=row.querySelectorAll('.sb');
  for(var i=0;i<btns.length;i++){
    var b=btns[i];
    var on=(val!=null&&Number(b.getAttribute('data-val'))===val);
    b.classList.remove('on0','on1','on2');
    if(on)b.classList.add('on'+val);
    b.setAttribute('aria-pressed',on?'true':'false');
  }
}
function paintAllRows(){
  var rows=$('catRows').querySelectorAll('.cat');
  for(var i=0;i<rows.length;i++)paintRow(rows[i]);
}
function cleanSum(){
  var t=0;
  state.config.categories.forEach(function(cat){
    var v=state.sel[cat.key];
    if(v!=null)t+=v;
  });
  return t;
}
function updateReadout(){
  $('cleanNum').textContent=cleanSum();
  $('polishNum').textContent=state.sel.polish;
}
function popEl(el){
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}
function setPolish(v,silent){
  var mn=polMin(),mx=polMax();
  v=Math.round(Number(v));
  if(isNaN(v))v=polDefault();
  if(v<mn)v=mn;
  if(v>mx)v=mx;
  state.sel.polish=v;
  $('polishVal').textContent=v;
  $('polMinus').disabled=(v<=mn);
  $('polPlus').disabled=(v>=mx);
  updateReadout();
  if(!silent){
    popEl($('polishVal'));
    popEl($('polishNum'));
  }
}
function updateSubmitBtn(){
  var b=$('submitBtn');
  b.disabled=state.submitting;
  b.innerHTML=state.submitting
    ?'<span class="btnspin"></span>Saving&hellip;'
    :(state.editing?'Update score':'Save score');
}
function formError(msg){
  $('formErr').innerHTML='<div class="banner">'+esc(msg)+'</div>';
}
function allTwos(){
  state.config.categories.forEach(function(cat){state.sel[cat.key]=2;});
  paintAllRows();
  var rows=$('catRows').querySelectorAll('.cat.missing');
  for(var i=0;i<rows.length;i++)rows[i].classList.remove('missing');
  $('formErr').innerHTML='';
  updateReadout();
  popEl($('cleanNum'));
  persistDraft();
  var btn=$('allTwosBtn');
  btn.classList.add('done');
  setTimeout(function(){btn.classList.remove('done');},900);
}
function backToPicker(){
  state.cabin=null;
  renderProgress();
  renderGroups();
  renderTieBanner();
  show('pickerView');
  window.scrollTo(0,state.pickerScroll);
}

/* ---------- submit ---------- */
function submit(){
  if(state.submitting)return;
  var missing=state.config.categories.filter(function(cat){
    return state.sel[cat.key]==null;
  });
  if(missing.length){
    missing.forEach(function(cat){
      var row=$('catRows').querySelector('.cat[data-key="'+cat.key+'"]');
      if(row)row.classList.add('missing');
    });
    formError('Score every category first: '+missing.map(catLabel).join(', ')+'.');
    var first=$('catRows').querySelector('.cat.missing');
    if(first&&first.scrollIntoView)first.scrollIntoView({block:'center',behavior:'smooth'});
    return;
  }
  var name=$('inspName').value.trim();
  if(!name){
    $('inspName').classList.add('missing');
    formError('Add your name in the Inspector box so we know who checked this cabin.');
    $('inspName').focus();
    return;
  }
  saveName(name);
  var rec={
    day:state.day,
    cabin:state.cabin.code,
    polish:state.sel.polish,
    inspector:name,
    notes:$('notes').value.trim()
  };
  state.config.categories.forEach(function(cat){rec[cat.key]=state.sel[cat.key];});
  state.submitting=true;
  $('formErr').innerHTML='';
  updateSubmitBtn();
  google.script.run
    .withSuccessHandler(function(resp){onSubmitOk(rec,resp);})
    .withFailureHandler(onSubmitErr)
    .submitScore(rec);
}
function onSubmitOk(rec,resp){
  state.submitting=false;
  var cleanliness=(resp&&resp.cleanliness!=null)?resp.cleanliness:localClean(rec);
  var polish=(resp&&resp.polish!=null)?resp.polish:rec.polish;
  var cached={};
  for(var k in rec)cached[k]=rec[k];
  cached.cleanliness=cleanliness;
  cached.polish=polish;
  state.scores[rec.cabin]=cached;
  clearDraft(rec.day,rec.cabin);
  var saved=state.cabin;
  var wasEdit=state.editing;
  backToPicker();
  refreshRankings(false);
  showToast(saved,cleanliness,polish,wasEdit);
}
function localClean(rec){
  var t=0;
  state.config.categories.forEach(function(cat){t+=rec[cat.key]||0;});
  return t;
}
function onSubmitErr(err){
  state.submitting=false;
  updateSubmitBtn();
  formError('Couldn’t save. Check your signal and tap Save again.'+
    (err&&err.message?' ('+err.message+')':''));
}

/* ---------- resolve ties ---------- */
function openTies(){
  if(!$('pickerView').hidden)state.pickerScroll=window.pageYOffset||0;
  state.tieTaps={};
  $('tiesDay').textContent=state.day;
  renderTies();
  show('tiesView');
  window.scrollTo(0,0);
}
function breakdownLine(cb){
  var parts=state.config.categories.map(function(cat){
    return esc(catLabel(cat).slice(0,3))+' '+esc(cb[cat.key]);
  });
  parts.push(polLabel().slice(0,3)+' '+esc(cb.polish));
  return parts.join(' · ');
}
function renderTies(){
  var wrap=$('tieList');
  if(state.rankErr){
    wrap.innerHTML='<div class="banner">Couldn&rsquo;t load ties for '+esc(state.day)+'.'+
      '<button type="button" class="retry" id="tieListRetry">Retry</button></div>';
    $('tieListRetry').onclick=function(){refreshRankings(false);};
    return;
  }
  if(!state.unresolvedTies.length){
    wrap.innerHTML='<p class="hint">No ties to break for '+esc(state.day)+'.</p>';
    return;
  }
  var html='';
  state.unresolvedTies.forEach(function(cl,ci){
    var taps=state.tieTaps[ci]||[];
    var busy=(state.tieSubmitting===ci);
    var ready=(taps.length===cl.cabins.length);
    html+='<div class="card tie-cluster">'+
      '<div class="tie-head">'+
      '<span class="pill" data-g="'+groupSlug(cl.ageGroup)+'"><span class="dot"></span>'+esc(cl.ageGroup)+'</span>'+
      '<span class="tie-vals">Cleanliness '+esc(cl.cleanliness)+' · '+polLabel()+' '+esc(cl.polish)+'</span></div>'+
      '<p class="tie-hint">Tap cabins from best to worst</p>';
    cl.cabins.forEach(function(cb){
      var pos=taps.indexOf(cb.cabin);
      html+='<button type="button" class="tie-row'+(pos>=0?' picked':'')+'" data-ci="'+ci+
        '" data-code="'+esc(cb.cabin)+'" aria-pressed="'+(pos>=0)+'" aria-label="'+esc(cb.cabin)+
        (pos>=0?', position '+(pos+1):', not ordered yet')+
        (cb.notes?', notes: '+esc(cb.notes):'')+'">'+
        '<span class="tie-rank">'+(pos>=0?(pos+1):'')+'</span>'+
        '<span class="tie-body"><span class="tie-code">'+esc(cb.cabin)+'</span>'+
        '<span class="tie-break">'+breakdownLine(cb)+'</span>'+
        (cb.notes?'<span class="tie-notes">&ldquo;'+esc(cb.notes)+'&rdquo;</span>':'')+
        '</span></button>';
    });
    html+='<div class="tie-actions">'+
      '<button type="button" class="tie-reset" data-ci="'+ci+'"'+(taps.length&&!busy?'':' disabled')+'>Reset</button>'+
      '<button type="button" class="tie-confirm" data-ci="'+ci+'"'+((ready&&!busy&&state.tieSubmitting==null)?'':' disabled')+'>'+
      (busy?'<span class="btnspin"></span>Saving&hellip;':'Confirm order')+'</button></div>'+
      '<div class="tie-err" id="tieErr'+ci+'" role="alert"></div></div>';
  });
  wrap.innerHTML=html;
}
function tieTap(ci,code){
  if(state.tieSubmitting!=null)return;
  var arr=state.tieTaps[ci]||(state.tieTaps[ci]=[]);
  var idx=arr.indexOf(code);
  if(idx>=0)arr.splice(idx,1);
  else arr.push(code);
  renderTies();
}
function confirmTie(ci){
  var cl=state.unresolvedTies[ci];
  var order=(state.tieTaps[ci]||[]).slice();
  if(!cl||order.length!==cl.cabins.length||state.tieSubmitting!=null)return;
  state.tieSubmitting=ci;
  renderTies();
  google.script.run
    .withSuccessHandler(function(){
      state.tieSubmitting=null;
      state.tieTaps={};
      refreshRankings(true);
    })
    .withFailureHandler(function(err){
      state.tieSubmitting=null;
      renderTies();
      var el=$('tieErr'+ci);
      if(el)el.innerHTML='<div class="banner">Couldn&rsquo;t save the order. Try again.'+
        (err&&err.message?' ('+esc(err.message)+')':'')+'</div>';
    })
    .setTieOrder(state.day,cl.ageGroup,order);
}

/* ---------- next-cabin toast ---------- */
function nextUnscored(after){
  var cabs=state.config.cabins;
  var start=0;
  cabs.forEach(function(c,i){if(c.code===after.code)start=i+1;});
  var n=cabs.length;
  var sameGroup=null,anywhere=null;
  for(var i=0;i<n;i++){
    var c=cabs[(start+i)%n];
    if(state.scores[c.code])continue;
    if(!anywhere)anywhere=c;
    if(!sameGroup&&c.ageGroup===after.ageGroup){sameGroup=c;break;}
  }
  return sameGroup||anywhere;
}
function showToast(cabin,cleanliness,polish,wasEdit){
  var t=$('toast');
  var nxt=nextUnscored(cabin);
  var allDone=doneCount()===state.config.cabins.length;
  t.innerHTML='<span class="tick">✓</span>'+
    '<div class="tmsg"><b>'+esc(cabin.code)+'</b> '+(wasEdit?'updated':'saved')+
    ' · <b>'+esc(cleanliness)+'/'+cleanMax()+'</b> · '+polLabel()+' '+esc(polish)+
    (allDone?'<div class="tsub">All '+state.config.cabins.length+' cabins scored. Nice rounds!</div>':'')+
    '</div>'+
    (nxt?'<button type="button" class="tnext" data-code="'+esc(nxt.code)+'">Next: '+esc(nxt.code)+'</button>':'')+
    '<button type="button" class="tclose" aria-label="Dismiss">✕</button>';
  t.classList.add('show');
  clearTimeout(state.toastTimer);
  state.toastTimer=setTimeout(hideToast,8000);
}
function simpleToast(msg){
  var t=$('toast');
  t.innerHTML='<span class="tick">✓</span>'+
    '<div class="tmsg">'+esc(msg)+'</div>'+
    '<button type="button" class="tclose" aria-label="Dismiss">✕</button>';
  t.classList.add('show');
  clearTimeout(state.toastTimer);
  state.toastTimer=setTimeout(hideToast,6000);
}
function hideToast(){
  $('toast').classList.remove('show');
  clearTimeout(state.toastTimer);
}

/* ---------- wiring ---------- */
document.addEventListener('DOMContentLoaded',function(){
  $('dayRow').addEventListener('click',function(ev){
    var btn=ev.target.closest('.seg-btn');
    if(!btn)return;
    var d=btn.getAttribute('data-day');
    if(d===state.day)return;
    if(state.armedDay===d){
      clearTimeout(state.armedTimer);
      state.armedTimer=null;
      state.armedDay=null;
      state.day=d;
      saveDay(d);
      state.unresolvedTies=[];
      state.rankErr=false;
      renderTieBanner();
      renderDayRow();
      loadScores();
      return;
    }
    clearTimeout(state.armedTimer);
    state.armedDay=d;
    renderDayRow();
    state.armedTimer=setTimeout(function(){
      if(state.armedDay===d){
        state.armedDay=null;
        state.armedTimer=null;
        renderDayRow();
      }
    },2500);
  });
  $('groups').addEventListener('click',function(ev){
    var tile=ev.target.closest('.tile');
    if(tile)openCabin(tile.getAttribute('data-code'));
  });
  $('formBody').addEventListener('click',function(ev){
    var btn=ev.target.closest('.sb');
    if(!btn)return;
    var row=btn.closest('.cat');
    var key=row.getAttribute('data-key');
    state.sel[key]=Number(btn.getAttribute('data-val'));
    row.classList.remove('missing');
    $('formErr').innerHTML='';
    paintRow(row);
    updateReadout();
    popEl($('cleanNum'));
    persistDraft();
  });
  $('polMinus').addEventListener('click',function(){setPolish(state.sel.polish-1);persistDraft();});
  $('polPlus').addEventListener('click',function(){setPolish(state.sel.polish+1);persistDraft();});
  $('notes').addEventListener('input',persistDraft);
  $('backBtn').addEventListener('click',backToPicker);
  $('tiesBackBtn').addEventListener('click',backToPicker);
  $('tieList').addEventListener('click',function(ev){
    var row=ev.target.closest('.tie-row');
    if(row){tieTap(Number(row.getAttribute('data-ci')),row.getAttribute('data-code'));return;}
    var rst=ev.target.closest('.tie-reset');
    if(rst){
      if(state.tieSubmitting==null){
        delete state.tieTaps[Number(rst.getAttribute('data-ci'))];
        renderTies();
      }
      return;
    }
    var cf=ev.target.closest('.tie-confirm');
    if(cf)confirmTie(Number(cf.getAttribute('data-ci')));
  });
  $('allTwosBtn').addEventListener('click',allTwos);
  $('submitBtn').addEventListener('click',submit);
  $('inspName').addEventListener('input',function(){
    this.classList.remove('missing');
    $('formErr').innerHTML='';
    saveName(this.value.trim());
  });
  $('toast').addEventListener('click',function(ev){
    var nxt=ev.target.closest('.tnext');
    if(nxt){
      hideToast();
      openCabin(nxt.getAttribute('data-code'));
      return;
    }
    if(ev.target.closest('.tclose'))hideToast();
  });
  $('fatalRetry').addEventListener('click',boot);
  boot();
});
})();
</script>
</body>
</html>
